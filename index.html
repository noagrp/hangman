<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0b10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hangman">
<title>Hangman</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
 --bg:#0b0b10;--card:#161622;--text:#fff;--muted:#8a8a96;
 --accent:#ff3838;--success:#05c46b;--key:#252536;--keyUsed:#11111a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--text);font-family:'Segoe UI',Tahoma,sans-serif;overflow:hidden}
body{min-height:100dvh;display:flex;justify-content:center;align-items:center;padding:max(6px,env(safe-area-inset-top)) max(6px,env(safe-area-inset-right)) max(6px,env(safe-area-inset-bottom)) max(6px,env(safe-area-inset-left))}
.game{
 width:min(100%,460px);height:min(100%,900px);background:var(--card);position:relative;
 display:grid;grid-template-rows:auto minmax(170px,1fr) auto auto auto;gap:8px;
 padding:12px;border-radius:0;box-shadow:0 18px 45px rgba(0,0,0,.55)
}
.header{display:flex;align-items:center;justify-content:space-between;gap:8px}
.stats{display:flex;gap:10px;font-weight:800;font-size:.82rem;flex-wrap:wrap}
.pill{background:#20202c;border:1px solid #30303f;border-radius:999px;padding:5px 8px}
#timer{color:#ff7272}
.controls{display:flex;gap:6px}
.iconBtn{border:0;background:#2a2a36;color:#fff;border-radius:10px;padding:7px 9px;font-weight:800}
canvas{width:100%;height:100%;min-height:170px;max-height:340px;background:#0f0f18;border-radius:14px;box-shadow:inset 0 0 15px rgba(0,0,0,.8)}
.clue{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;margin-bottom:5px;color:#b7b7c5;font-size:.78rem}.clue strong{color:#ffd166;font-size:.8rem;text-transform:uppercase;letter-spacing:1px}.clue span{max-width:95%;line-height:1.25}
.word-display{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;row-gap:8px;align-items:center;min-height:52px}
.word-block{display:flex;gap:4px;white-space:nowrap;font:800 clamp(1.15rem,5vw,1.65rem)/1.1 'Courier New',monospace;text-transform:uppercase}
.char{min-width:.8ch;text-align:center}
.used{min-height:18px;text-align:center;color:#ff9b77;font-size:.78rem;font-weight:700;letter-spacing:1px}
.keyboard{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.key{
 min-height:40px;border:1px solid #3a3a4b;background:var(--key);color:#fff;border-radius:9px;
 font-weight:900;font-size:.95rem;box-shadow:0 3px 0 #0d0d12
}
.key:active{transform:translateY(2px);box-shadow:0 1px 0 #0d0d12}
.key.correct{background:#123d2b;border-color:#1e6a49;color:#77ffb7}
.key.wrong{background:#4d2025;border-color:#7b3039;color:#ff9fa7}
.key.used{background:var(--keyUsed);color:#555;border-color:#20202b;box-shadow:none}
.footerNote{text-align:center;color:#737380;font-size:.7rem}
.overlay{
 display:none;position:absolute;inset:0;background:rgba(9,9,12,.96);z-index:10;
 align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:24px
}
.overlay.show{display:flex}
.overlay h2{font-size:2rem;margin:0 0 8px}
.overlay p{margin:4px 0 14px;color:#c2c2c9;line-height:1.45}
.action{border:0;border-radius:24px;padding:13px 28px;background:var(--accent);color:#fff;font-weight:900;font-size:1rem}
.small{font-size:.76rem;color:#888}
@media(min-width:470px){.game{border:2px solid #30303b;border-radius:24px;height:94dvh}}
@media(max-height:720px){
 .game{grid-template-rows:auto minmax(135px,1fr) auto auto auto;padding:8px;gap:5px}
 canvas{min-height:135px;max-height:250px}.key{min-height:34px;font-size:.85rem}.word-display{min-height:42px}
}
@media(max-width:360px){.keyboard{gap:4px}.key{min-height:36px}.stats{gap:5px;font-size:.74rem}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="game" id="game">
 <div class="header">
   <div class="stats">
     <div class="pill">LV <span id="level">1</span></div>
     <div class="pill">STREAK <span id="streak">0</span></div>
     <div class="pill" id="timer">10.0s</div>
   </div>
   <div class="controls">
     <button class="iconBtn" id="pauseBtn">Ⅱ</button>
     <button class="iconBtn" id="audioBtn">🔊</button>
   </div>
 </div>

 <canvas id="hangmanCanvas"></canvas>

 <div>
   <div class="clue"><strong id="categoryText">Category</strong><span id="hintText">Clue</span></div>
   <div class="word-display" id="wordSpace"></div>
   <div class="used" id="usedSpace"></div>
 </div>

 <div class="keyboard" id="keyboard"></div>
 <div class="footerNote">Tap letters or use your physical keyboard</div>

 <div class="overlay" id="overlay">
   <h2 id="overlayTitle">HANGMAN</h2>
   <p id="overlayMsg"></p>
   <div class="small" id="overlayMeta"></div>
   <button class="action" id="actionBtn">Start</button>
 </div>
</div>

<script src="words.js"></script>
<script>
const canvas=document.getElementById('hangmanCanvas'),ctx=canvas.getContext('2d');
const wordSpace=document.getElementById('wordSpace'),usedSpace=document.getElementById('usedSpace');
const keyboard=document.getElementById('keyboard'),levelEl=document.getElementById('level');
const categoryText=document.getElementById('categoryText'),hintText=document.getElementById('hintText');
const streakEl=document.getElementById('streak'),timerEl=document.getElementById('timer');
const pauseBtn=document.getElementById('pauseBtn'),audioBtn=document.getElementById('audioBtn');
const overlay=document.getElementById('overlay'),overlayTitle=document.getElementById('overlayTitle');
const overlayMsg=document.getElementById('overlayMsg'),overlayMeta=document.getElementById('overlayMeta');
const actionBtn=document.getElementById('actionBtn');

let level=1,streak=0,bestLevel=Number(localStorage.getItem('hangman-best-level')||0);
let currentEntry=null,currentWord='',display=[],guessed=new Set(),wrongAttempts=0,maxAttempts=5;
let timeLeft=10,timer=null,paused=false,gameActive=false,recentWords=[];
let muted=localStorage.getItem('hangman-muted')==='1',audioCtx=null,bgTimer=null,currentNote=0;
let animId=0,ropeOffset=0,swing=0,particles=[];
const melody=[261.63,293.66,329.63,349.23,392,349.23,329.63,293.66];

function initAudio(){
 if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();
 if(audioCtx.state==='suspended')audioCtx.resume();
 if(!bgTimer)bgTimer=setInterval(()=>{if(!muted&&gameActive&&!paused&&!overlay.classList.contains('show')){tone(melody[currentNote],'triangle',.14,.035);currentNote=(currentNote+1)%melody.length}},520);
}
function tone(freq,type='sine',dur=.1,vol=.06){
 if(!audioCtx||muted)return;
 try{
  const o=audioCtx.createOscillator(),g=audioCtx.createGain(),now=audioCtx.currentTime;
  o.type=type;o.frequency.setValueAtTime(freq,now);g.gain.setValueAtTime(vol,now);
  g.gain.exponentialRampToValueAtTime(.0001,now+dur);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(now+dur)
 }catch(e){}
}
function sfx(type){
 if(type==='wrong'){tone(210,'sawtooth',.1,.08);setTimeout(()=>tone(320,'sawtooth',.1,.06),55)}
 else if(type==='win'){[523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,'sine',.22,.08),i*80))}
 else if(type==='lose'){[220,196,174,146].forEach((f,i)=>setTimeout(()=>tone(f,'square',.28,.07),i*120))}
}
audioBtn.textContent=muted?'🔇':'🔊';
audioBtn.onclick=()=>{muted=!muted;localStorage.setItem('hangman-muted',muted?'1':'0');audioBtn.textContent=muted?'🔇':'🔊';initAudio()};

function resizeCanvas(){
 const rect=canvas.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);
 canvas.width=Math.max(1,Math.round(rect.width*dpr));canvas.height=Math.max(1,Math.round(rect.height*dpr));
 ctx.setTransform(dpr,0,0,dpr,0,0);drawScene();
}
window.addEventListener('resize',resizeCanvas);

function createParticles(){
 particles=Array.from({length:16},()=>({x:Math.random()*300,y:Math.random()*260,len:20+Math.random()*35,speed:2+Math.random()*3,a:.04+Math.random()*.08}));
}
createParticles();

function drawScene(){
 const w=canvas.clientWidth,h=canvas.clientHeight;if(!w||!h)return;
 ctx.clearRect(0,0,w,h);ctx.fillStyle='#0f0f18';ctx.fillRect(0,0,w,h);
 const sx=w/300,sy=h/300;
 ctx.save();ctx.scale(sx,sy);
 for(const p of particles){
  ctx.strokeStyle=`rgba(180,190,255,${p.a})`;ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x+p.len,p.y);ctx.stroke();
 }

 const stage=Math.min(maxAttempts,wrongAttempts);
 const progress=stage/maxAttempts;
 const targetLift=progress*92;
 ropeOffset+=(targetLift-ropeOffset)*.12;
 swing+=.035;
 const sw=Math.sin(swing)*(stage>0?1.8:.35);

 // Simple gantry and ground.
 ctx.strokeStyle='#f2f2f2';ctx.lineWidth=6;ctx.lineCap='round';
 ctx.beginPath();ctx.moveTo(48,260);ctx.lineTo(48,32);ctx.lineTo(208,32);ctx.stroke();

 ctx.strokeStyle='#555';ctx.lineWidth=4;
 ctx.beginPath();ctx.moveTo(118,266);ctx.lineTo(270,266);ctx.stroke();

 // Character starts standing. Wrong guesses lift the whole character upward.
 const cx=205+sw;
 const standingHeadY=171;
 const cy=standingHeadY-ropeOffset;

 // One straight rope line that stops behind the head.
 ctx.strokeStyle='#9b774f';ctx.lineWidth=3;
 ctx.beginPath();ctx.moveTo(cx,32);ctx.lineTo(cx,cy+14);ctx.stroke();

 // Full-color head with simple facial emotion.
 let headColor='#6ecbff';
 if(stage>=4) headColor='#ff8d8d';
 else if(stage>=2) headColor='#ffd166';

 ctx.fillStyle=headColor;
 ctx.beginPath();ctx.arc(cx,cy,17,0,Math.PI*2);ctx.fill();
 ctx.strokeStyle='#ffffff';ctx.lineWidth=3;
 ctx.beginPath();ctx.arc(cx,cy,17,0,Math.PI*2);ctx.stroke();

 // Face
 ctx.strokeStyle='#111';ctx.fillStyle='#111';ctx.lineWidth=2;
 if(stage<=1){
  ctx.beginPath();ctx.arc(cx-6,cy-4,2,0,Math.PI*2);ctx.arc(cx+6,cy-4,2,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(cx,cy+4,5,0.15*Math.PI,0.85*Math.PI);ctx.stroke();
 }else if(stage<=3){
  ctx.beginPath();ctx.arc(cx-6,cy-4,2,0,Math.PI*2);ctx.arc(cx+6,cy-4,2,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.moveTo(cx-5,cy+8);ctx.lineTo(cx+5,cy+8);ctx.stroke();
  ctx.beginPath();ctx.moveTo(cx-9,cy-10);ctx.lineTo(cx-3,cy-8);ctx.moveTo(cx+3,cy-8);ctx.lineTo(cx+9,cy-10);ctx.stroke();
 }else{
  ctx.beginPath();
  ctx.moveTo(cx-9,cy-6);ctx.lineTo(cx-3,cy-1);
  ctx.moveTo(cx-9,cy-1);ctx.lineTo(cx-3,cy-6);
  ctx.moveTo(cx+3,cy-6);ctx.lineTo(cx+9,cy-1);
  ctx.moveTo(cx+3,cy-1);ctx.lineTo(cx+9,cy-6);
  ctx.stroke();
  ctx.beginPath();ctx.arc(cx,cy+11,6,1.15*Math.PI,1.85*Math.PI,true);ctx.stroke();
 }

 // Stick figure body is drawn over the rope so the rope stays visually behind.
 ctx.strokeStyle='#fff';ctx.lineWidth=4;
 ctx.beginPath();ctx.moveTo(cx,cy+17);ctx.lineTo(cx,cy+68);
 ctx.moveTo(cx,cy+35);ctx.lineTo(cx-23,cy+54);
 ctx.moveTo(cx,cy+35);ctx.lineTo(cx+23,cy+54);
 ctx.moveTo(cx,cy+68);ctx.lineTo(cx-20,cy+95);
 ctx.moveTo(cx,cy+68);ctx.lineTo(cx+20,cy+95);ctx.stroke();

 if(stage===0){
  ctx.fillStyle='#88ff9b';ctx.font='bold 11px sans-serif';ctx.textAlign='center';
  ctx.fillText('SAFE',205,286);
 }else{
  ctx.fillStyle='#ff9b9b';ctx.font='bold 10px sans-serif';ctx.textAlign='center';
  ctx.fillText(`${stage} / ${maxAttempts} WRONG`,205,286);
 }
 ctx.restore();
}
function animate(){
 particles.forEach(p=>{p.x+=p.speed;if(p.x>330)p.x=-p.len});
 drawScene();animId=requestAnimationFrame(animate);
}

function difficultyScore(entry){
 const word=typeof entry==='string'?entry:entry.word;
 const letters=word.replace(/[^a-z]/g,'').length,spaces=(word.match(/ /g)||[]).length;
 return letters+spaces*3;
}
function chooseWord(){
 const available=wordLibrary.filter(entry=>!recentWords.includes((typeof entry==='string'?entry:entry.word)));
 const pool=available.length?available:wordLibrary;
 const target=Math.min(26,7+level*1.05);
 const ranked=[...pool].sort((a,b)=>Math.abs(difficultyScore(a)-target)-Math.abs(difficultyScore(b)-target));
 const top=ranked.slice(0,Math.min(24,ranked.length));
 const picked=top[Math.floor(Math.random()*top.length)];
 const word=(typeof picked==='string'?picked:picked.word).toLowerCase();
 recentWords.push(word);if(recentWords.length>12)recentWords.shift();
 return typeof picked==='string'?{word,category:'General',hint:'Think of a common word or phrase.'}:{...picked,word};
}
function levelTime(word){
 const complexity=difficultyScore(word);
 return Math.max(8,Math.min(18,13 + complexity*.14 - (level-1)*.10));
}
function initLevel(){
 clearInterval(timer);guessed.clear();wrongAttempts=0;paused=false;gameActive=true;
 currentEntry=chooseWord();currentWord=currentEntry.word;categoryText.textContent=currentEntry.category;hintText.textContent=currentEntry.hint;display=[...currentWord].map(c=>c===' '?' ':c==='-'?'-':'_');
 timeLeft=levelTime(currentWord);levelEl.textContent=level;streakEl.textContent=streak;
 ropeOffset=0;renderWord();renderKeyboard();usedSpace.textContent='';updateTimerText();
 timer=setInterval(()=>{if(!paused&&gameActive){timeLeft=Math.max(0,timeLeft-.1);updateTimerText();if(timeLeft<=0)lose('Time ran out.')}},100);
}
function updateTimerText(){timerEl.textContent=`${timeLeft.toFixed(1)}s`;timerEl.style.color=timeLeft<4?'#ff5757':'#ff8a8a'}
function renderWord(){
 wordSpace.innerHTML='';
 currentWord.split(' ').forEach((word,wi)=>{
  const block=document.createElement('div');block.className='word-block';
  let offset=0;for(let i=0;i<wi;i++)offset+=currentWord.split(' ')[i].length+1;
  [...word].forEach((ch,j)=>{const s=document.createElement('span');s.className='char';s.textContent=display[offset+j]==='_'?'_':display[offset+j].toUpperCase();block.appendChild(s)});
  wordSpace.appendChild(block);
 });
}
function renderKeyboard(){
 keyboard.innerHTML='';
 for(const l of 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'){
  const b=document.createElement('button');b.className='key';b.textContent=l;b.dataset.letter=l.toLowerCase();
  if(guessed.has(l.toLowerCase())){b.classList.add(currentWord.includes(l.toLowerCase())?'correct':'wrong','used');b.disabled=true}
  b.onclick=()=>guess(l.toLowerCase());keyboard.appendChild(b)
 }
}
function guess(letter){
 if(!gameActive||paused||guessed.has(letter))return;initAudio();guessed.add(letter);
 if(currentWord.includes(letter)){
  [...currentWord].forEach((c,i)=>{if(c===letter)display[i]=letter});tone(620,'sine',.08,.05)
 }else{wrongAttempts++;sfx('wrong')}
 usedSpace.textContent=[...guessed].filter(l=>!currentWord.includes(l)).map(l=>l.toUpperCase()).join(' · ');
 renderWord();renderKeyboard();
 if(!display.includes('_'))win();else if(wrongAttempts>=maxAttempts)lose('Too many wrong guesses.');
}
function win(){
 gameActive=false;clearInterval(timer);streak++;level++;if(level>bestLevel){bestLevel=level;localStorage.setItem('hangman-best-level',String(bestLevel))}
 sfx('win');showOverlay('LEVEL CLEAR',`Answer: ${currentWord.toUpperCase()}`,`Streak ${streak} · Best level ${bestLevel}`,'NEXT LEVEL');
}
function lose(reason){
 if(!gameActive)return;gameActive=false;clearInterval(timer);streak=0;sfx('lose');
 showOverlay('GAME OVER',`${reason}<br>Answer: <strong>${currentWord.toUpperCase()}</strong>`,`Reached level ${level} · Best level ${bestLevel}`,'TRY AGAIN');
}
function showOverlay(title,msg,meta,btn){
 overlayTitle.textContent=title;overlayMsg.innerHTML=msg;overlayMeta.textContent=meta;actionBtn.textContent=btn;overlay.classList.add('show')
}
function startFresh(){overlay.classList.remove('show');level=1;streak=0;initLevel()}
actionBtn.onclick=()=>{overlay.classList.remove('show');if(!gameActive&&overlayTitle.textContent==='LEVEL CLEAR')initLevel();else if(!gameActive)startFresh();else setPause(false)};
function setPause(v){
 if(!gameActive)return;paused=v;pauseBtn.textContent=paused?'▶':'Ⅱ';
 if(paused)showOverlay('PAUSED','Game paused.','Timer is stopped.','RESUME');
 else overlay.classList.remove('show')
}
pauseBtn.onclick=()=>setPause(!paused);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&gameActive&&!paused)setPause(true)});
document.addEventListener('keydown',e=>{
 if(e.key>='a'&&e.key<='z')guess(e.key);
 else if(e.key>='A'&&e.key<='Z')guess(e.key.toLowerCase());
 else if(e.key==='Escape'&&gameActive)setPause(!paused);
 else if(e.key==='Enter'&&overlay.classList.contains('show'))actionBtn.click();
});

refreshStart();
function refreshStart(){
 overlayTitle.textContent='HANGMAN';
 overlayMsg.innerHTML='Use the category and clue to solve the word.<br>The character starts safe and rises only after wrong guesses.';
 overlayMeta.textContent=`Best level ${bestLevel}`;
 actionBtn.textContent='START';
 overlay.classList.add('show');
}
resizeCanvas();cancelAnimationFrame(animId);animate();
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js'));
</script>
</body>
</html>
